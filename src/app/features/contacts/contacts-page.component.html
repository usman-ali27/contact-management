<main
  class="shell"
  [attr.data-mobile-view]="mobileView()"
  [attr.data-list-hidden]="!listVisible()"
>
  <app-contact-list
    class="shell__list"
    [contacts]="contacts()"
    [loading]="loading()"
    [error]="error()"
    [selectedId]="selectedContact()?.id ?? null"
    (contactSelected)="onContactSelected($event)"
    (retry)="loadContacts()"
    (menu)="toggleList()"
    (previous)="selectAdjacent(-1)"
    (next)="selectAdjacent(1)"
  />

  @if (!listVisible()) {
    <button type="button" class="reopen" (click)="toggleList()" aria-label="Show contacts">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
  }

  <app-contact-details
    class="shell__details"
    [contact]="selectedContact()"
    [emailAddresses]="emailAddresses()"
    [emailsLoading]="emailsLoading()"
    (back)="showList()"
  />
</main>
